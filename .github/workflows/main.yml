name: Actions 😎

on: [push]

# Один проект — одна очередь: деплои не бегут параллельно и не ломают docker-compose на сервере.
concurrency:
  group: deploy-rust_calculator
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.actor }}/rust_calculator/app:latest
  API_IMAGE_NAME: ${{ github.actor }}/rust_calculator/api:latest
  PROJECT_NAME: rust_calculator

jobs:
  build:
    name: Build my project ✨
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build and push (amd64 + arm64)
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 --push --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} .
          docker buildx build --platform linux/amd64,linux/arm64 --push --target api --tag ${{ env.REGISTRY }}/${{ env.API_IMAGE_NAME }} .

  deploy:
    name: Deploy image ✨
    needs: build
    # На сервер уезжает только main; ветки лишь собираются.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Docker compose pull and up
        uses: appleboy/ssh-action@v1.0.2
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ vars.SSH_PORT }}
          debug: true
          script_stop: true
          script: |
            export PATH="$PATH:/usr/local/bin"
            security unlock-keychain -p ${{ secrets.SSH_PASSWORD }}
            cd ${{ vars.WORK_DIR }}/${{ env.PROJECT_NAME }}
            echo ${{ secrets.CR_PAT }} | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            docker-compose pull
            docker-compose up -d
