services:
  rust-calculator:
    image: ghcr.io/vadimptr/rust_calculator/app:latest
    ports:
      - "127.0.0.1:9092:80"
    depends_on:
      - api
    restart: unless-stopped

  api:
    image: ghcr.io/vadimptr/rust_calculator/api:latest
    environment:
      WRITE_TOKEN: ${WRITE_TOKEN:-}
    volumes:
      - schemes:/data
    restart: unless-stopped

volumes:
  schemes:
